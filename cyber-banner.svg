<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Tanish Rao — Cyber Systems</title><desc id="desc">Dark cyberpunk banner with neon green grid, system readouts, and developer identity.</desc>
